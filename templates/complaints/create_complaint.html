{% extends 'base.html' %}

{% block title %}Submit Complaint Ticket - HomeServices{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="custom-card p-4">
            <div class="text-center mb-4">
                <div class="service-icon-box mx-auto text-warning bg-warning-subtle">
                    <i class="fa-solid fa-circle-exclamation"></i>
                </div>
                <h3 class="fw-bold">File a Complaint Ticket</h3>
                <p class="text-muted">Regarding Booking #{{ booking.id }} ({{ booking.service.name }})</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Complaint Subject *</label>
                    <input type="text" name="subject" class="form-control" placeholder="e.g., Delay in service / Incomplete work..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Detailed Description *</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Please describe the issue in detail so our support team can investigate..." required></textarea>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'booking_detail' booking.id %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning text-dark fw-bold"><i class="fa-solid fa-paper-plane me-1"></i> Submit Complaint</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
