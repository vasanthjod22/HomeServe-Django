{% extends 'base.html' %}

{% block title %}{{ title }} - HomeServices{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="custom-card p-4">
            <h3 class="fw-bold mb-4">{{ title }}</h3>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Service Category</label>
                    {{ form.category }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Service Name</label>
                    {{ form.name }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    {{ form.description }}
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Base Price (₹)</label>
                        {{ form.price }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estimated Hours</label>
                        {{ form.estimated_hours }}
                    </div>
                </div>
                <div class="mb-4 form-check">
                    {{ form.is_active }}
                    <label class="form-check-label fw-semibold" for="{{ form.is_active.id_for_label }}">Active Service (Visible to customers)</label>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'manage_services' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom">Save Service</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
