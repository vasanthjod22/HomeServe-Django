{% extends 'base.html' %}

{% block title %}Login - HomeServices{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="custom-card p-4">
            <div class="text-center mb-4">
                <div class="service-icon-box mx-auto">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h3 class="fw-bold">Sign In</h3>
                <p class="text-muted">Access your Customer, Provider, or Admin Portal</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 mt-2">Login</button>
            </form>
            
            <hr class="my-4">
            
            <div class="text-center text-muted">
                <p class="mb-1">Don't have an account?</p>
                <a href="{% url 'register_customer' %}" class="fw-semibold text-decoration-none">Register as Customer</a> or 
                <a href="{% url 'register_provider' %}" class="fw-semibold text-decoration-none">Service Provider</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
